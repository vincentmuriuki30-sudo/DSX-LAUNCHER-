name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and Build App
        run: |
          mkdir -p app/src/main
          cp -r src app/src/main/
          cp AndroidManifest.xml app/src/main/
          echo "android { namespace 'com.launcher' compileSdk 34 defaultConfig { minSdk 21 targetSdk 34 } }" > app/build.gradle
          echo "include ':app'" > settings.gradle
          ./gradlew assembleDebug --no-daemon || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
