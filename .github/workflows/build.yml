name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Build Tools & Compile APK
        run: |
          sudo apt-get update && sudo apt-get install -y gradle
          mkdir -p app/src/main
          cp -r src app/src/main/
          cp AndroidManifest.xml app/src/main/
          
          # Create a working gradle build file
          echo "plugins { id 'com.android.application' }" > app/build.gradle
          echo "android { namespace 'com.android.launcher' compileSdk 34 defaultConfig { minSdk 21 targetSdk 34 } }" >> app/build.gradle
          echo "include ':app'" > settings.gradle
          echo "buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0' } }" > build.gradle
          echo "dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google(); mavenCentral() } }" >> settings.gradle

          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
